# Build/deploy half of ./update.sh (`pnpm run build` + publish to gh-pages).
# Runs on pushes to main (e.g. normal merges) and on workflow_dispatch —
# including the explicit dispatch from "Catalog refresh" after a data push
# (needed because GITHUB_TOKEN pushes do not trigger on:push workflows).
name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: pnpm run build

      # Publish ./dist to the existing gh-pages branch with GITHUB_TOKEN.
      # Keeps Pages + Mudlet (which reads catalog.json from branch gh-pages).
      # Prefer this over actions/deploy-pages so we don't abandon the branch source.
      - name: Deploy dist to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          touch dist/.nojekyll
          cd dist
          git init
          git checkout -B gh-pages
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
