# CI equivalent of ./update.sh:
# fetch catalog/trainers/customs/summary from vault-thirteen, commit if changed, deploy Pages.
name: Catalog update

on:
  schedule:
    # Daily 06:00 UTC — override timing later if needed
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch catalog data
        run: |
          set -euo pipefail
          BASE='http://vault-thirteen.net:49160'
          fetch() {
            local url="$1" dest="$2"
            local tmp="${dest}.tmp"
            curl -fsS --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 \
              -o "$tmp" "$url"
            mv "$tmp" "$dest"
          }
          fetch "$BASE/trainers" public/trainers.json
          fetch "$BASE/customs" public/customs.json
          fetch "$BASE/catalog" public/catalog.json
          fetch "$BASE/catalog/summary" public/summary.json

      - name: Commit and push if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog.json public/customs.json public/summary.json public/trainers.json
          if git diff --staged --quiet; then
            echo 'No catalog file changes; skipping commit, push, and deploy.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'catalog update'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.commit.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build site
        if: steps.commit.outputs.changed == 'true'
        run: pnpm run build

      - name: Deploy to gh-pages
        if: steps.commit.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Matches prior `gh-pages -d dist` publishing branch
          publish_branch: gh-pages
