# Build any non-main branch and force-publish ./dist to the sibling
# preview repo njs50/tcat-preview (branch gh-pages). Last non-main
# branch push wins — intentional for agent-check previews.
#
# After the push, wait for tcat-preview's "pages build and deployment"
# workflow and surface it on the tfecat pull request: a commit status
# (tcat-preview/pages-build-deployment) plus a comment with that
# workflow's status badge.
#
# Requires repo secret TCAT_PREVIEW_PAT: fine-grained PAT on
# njs50/tcat-preview with Contents read/write (push), plus Actions and
# Pages read so the job can tell when that preview is deployed.
# Polling tries the PAT first, then the public Actions API.
name: Preview deploy

on:
  push:
    branches-ignore:
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: preview-deploy
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Project Pages URL is https://njs50.github.io/tcat-preview/
      # so Vite base must be /tcat-preview/ (prod on tfecat stays /tfecat/).
      # VITE_PREVIEW_* bake a bottom-left branch/SHA watermark (absent in prod).
      - name: Build site for tcat-preview
        env:
          VITE_PREVIEW_REF: ${{ github.ref_name }}
          VITE_PREVIEW_SHA: ${{ github.sha }}
          VITE_BUILD_ID: ${{ github.sha }}
        run: pnpm exec vue-tsc && pnpm exec vite build --base=/tcat-preview/

      # Rapid tip pushes collide on GitHub Pages ("in progress deployment … cancel
      # <previous sha>"). Wait for the github-pages deployment slot to go idle
      # before force-pushing gh-pages.
      - name: Wait for tcat-preview Pages deploy slot
        env:
          TCAT_PREVIEW_PAT: ${{ secrets.TCAT_PREVIEW_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TCAT_PREVIEW_PAT}" ]; then
            echo 'Missing secret TCAT_PREVIEW_PAT' >&2
            exit 1
          fi
          API="https://api.github.com/repos/njs50/tcat-preview"
          AUTH="Authorization: Bearer ${TCAT_PREVIEW_PAT}"
          for attempt in $(seq 1 60); do
            ids=$(curl -sS -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "${API}/deployments?environment=github-pages&per_page=5" \
              | jq -r '.[].id')
            busy=0
            for id in $ids; do
              state=$(curl -sS -H "$AUTH" -H "Accept: application/vnd.github+json" \
                "${API}/deployments/${id}/statuses" \
                | jq -r '.[0].state // "none"')
              case "$state" in
                in_progress|queued|pending|waiting) busy=1 ;;
              esac
            done
            if [ "$busy" = "0" ]; then
              echo "Pages deploy slot idle (attempt ${attempt})"
              # Brief settle — Pages sometimes still rejects for a few seconds.
              sleep 15
              exit 0
            fi
            echo "Pages deploy slot busy (attempt ${attempt}/60); sleeping 10s"
            sleep 10
          done
          echo 'Timed out waiting for idle Pages deploy slot; pushing anyway' >&2

      - name: Deploy dist to njs50/tcat-preview gh-pages
        id: deploy
        env:
          TCAT_PREVIEW_PAT: ${{ secrets.TCAT_PREVIEW_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TCAT_PREVIEW_PAT}" ]; then
            echo 'Missing secret TCAT_PREVIEW_PAT (fine-grained PAT with Contents R/W on njs50/tcat-preview).' >&2
            exit 1
          fi
          touch dist/.nojekyll
          cd dist
          git init
          git checkout -B gh-pages
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Preview ${GITHUB_SHA} from ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
          git push --force "https://x-access-token:${TCAT_PREVIEW_PAT}@github.com/njs50/tcat-preview.git" HEAD:gh-pages
          echo "preview_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report Pages build status on the pull request
        timeout-minutes: 12
        env:
          PREVIEW_SHA: ${{ steps.deploy.outputs.preview_sha }}
          TCAT_PREVIEW_PAT: ${{ secrets.TCAT_PREVIEW_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ATTEMPTS: "45"
          SLEEP_SECONDS: "10"
        run: bash .github/scripts/report-preview-pages-status.sh
